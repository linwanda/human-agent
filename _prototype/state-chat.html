<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>晚风 Agent · 对话态</title>
<link rel="stylesheet" href="theme.css">
<style>
  .chat-head {
    height: 52px; flex: none; display: flex; align-items: center; gap: 11px;
    padding: 0 20px; border-bottom: 1px solid var(--line);
  }
  .chat-head b { font-size: 13.5px; font-weight: 600; }
  .chat-head span { font-size: 12px; color: var(--ink-3); }
  .who-av {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    font-size: 12px; font-weight: 600; color: #46557c;
    background: linear-gradient(160deg, rgba(255,255,255,.95), rgba(238,244,255,.88));
    border: 1px solid var(--line); box-shadow: var(--hi);
  }
  .stream { flex: 1; overflow: hidden; padding: 22px 26px 6px; display: flex; flex-direction: column; gap: 18px; }
  .day { text-align: center; font-size: 11.5px; color: var(--ink-3); }
  .msg { display: flex; gap: 10px; max-width: 74%; }
  .msg .name { font-size: 11.5px; color: var(--ink-3); margin-bottom: 5px; }
  .bubble {
    padding: 10px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.62;
    background: var(--glass-2); border: 1px solid var(--line); box-shadow: var(--hi);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  }
  .msg.them { align-self: flex-start; }
  .msg.me { align-self: flex-end; flex-direction: row-reverse; }
  .msg.me .name { text-align: right; color: var(--voice-2); }
  .msg.me .bubble {
    background: linear-gradient(150deg, rgba(77,107,254,.15), rgba(77,107,254,.07));
    border-color: var(--voice-line); color: #17234d;
    box-shadow: 0 10px 28px -18px rgba(77,107,254,.55), var(--hi);
  }
  .acts { display: flex; gap: 6px; margin-top: 6px; justify-content: flex-end; }
  .acts span {
    font-size: 11.5px; color: var(--ink-3); padding: 3px 9px; border-radius: 7px;
    background: var(--glass-1); border: 1px solid var(--line);
  }
  .acts span.k { color: var(--voice-2); border-color: var(--voice-line); background: var(--voice-dim); }

  /* 底部输入：第二层玻璃，浮在对话之上 */
  .composer { flex: none; padding: 10px 20px 18px; }
  .composer-inner {
    display: flex; align-items: flex-end; gap: 10px; padding: 8px 8px 8px 10px;
    border-radius: 14px; background: var(--glass-3);
    border: 1px solid var(--line-2); box-shadow: var(--shadow-card), var(--hi);
    -webkit-backdrop-filter: blur(28px) saturate(1.4); backdrop-filter: blur(28px) saturate(1.4);
  }
  .attach {
    width: 34px; height: 34px; flex: none; border-radius: 9px; display: grid; place-items: center;
    color: var(--ink-2); font-size: 16px; background: var(--glass-2); border: 1px solid var(--line);
  }
  .field { flex: 1; padding: 7px 4px; color: var(--ink-3); font-size: 13.5px; }
  .send {
    height: 34px; padding: 0 18px; border-radius: 9px; font-size: 13px; font-weight: 600;
    color: #fff; background: linear-gradient(160deg, var(--voice-2), var(--voice));
    display: grid; place-items: center; box-shadow: 0 8px 22px -10px rgba(77,107,254,.7);
  }
  .hint { margin: 9px 2px 0; font-size: 11.5px; color: var(--ink-3); display: flex; gap: 10px; }
</style>
</head>
<body>
<div class="window">
  <header class="titlebar">
    <div class="brand"><span class="mark">晚</span>晚风 Agent</div>
    <div class="tabs">
      <span class="tab">要不要接这个 offer <i>×</i></span>
    </div>
    <div class="spacer"></div>
    <div class="winbtns"><i>—</i><i>▢</i><i>✕</i></div>
  </header>
  <div class="body">
    <nav class="rail">
      <span class="av on">陈</span>
      <span class="av">哲</span>
      <span class="av new">王</span>
      <span class="av">林</span>
      <span class="av">许</span>
      <span class="av">妈</span>
      <div class="sep"></div>
      <span class="av">+</span>
      <div class="rail-foot">⚙</div>
    </nav>
    <main class="main">
      <div class="chat-head">
        <span class="who-av">陈</span>
        <div><b>老陈</b> <span>· 高中同学 · 熟人语气</span></div>
      </div>
      <div class="stream">
        <div class="day">今天 14:18</div>
        <div class="msg them">
          <div>
            <div class="name">老陈</div>
            <div class="bubble">周末有空吗？一起去打球</div>
          </div>
        </div>
        <div class="msg me">
          <div>
            <div class="name">晚风 · 替你回的</div>
            <div class="bubble">周六下午可以，你定场地？</div>
            <div class="acts"><span>接管</span><span>改一句</span></div>
          </div>
        </div>
        <div class="msg them">
          <div>
            <div class="name">老陈</div>
            <div class="bubble">那就老地方，三点</div>
          </div>
        </div>
        <div class="msg me">
          <div>
            <div class="name">晚风 · 替你回的</div>
            <div class="bubble">行，我到点过去</div>
            <div class="acts"><span class="k">已发出</span><span>接管</span></div>
          </div>
        </div>
      </div>
      <div class="composer">
        <div class="composer-inner">
          <span class="attach">＋</span>
          <div class="field">说点什么，或者贴张图</div>
          <span class="send">发送</span>
        </div>
        <div class="hint"><span>Enter 发送 · Shift+Enter 换行</span><span>可以直接粘图或拖文件进来</span></div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
