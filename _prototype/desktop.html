<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>晚风 Agent · 桌面端原型</title>
<style>
  :root {
    --ink: #14171a; --ink-2: #3d444a; --muted: #7b8188; --faint: #a3a8ae;
    --voice: #2b6a56; --voice-2: #367f66; --voice-soft: rgba(43,106,86,.10);
    --paper: #f4f4f2; --surface: #fbfbfa; --card: #ffffff;
    --line: rgba(20,23,26,.10); --line-soft: rgba(20,23,26,.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px; background: linear-gradient(150deg, #d9dcd8, #c9cfcb 55%, #dfe3e0);
    font: 14px/1.6 -apple-system, "Segoe UI Variable", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
  }
  /* ---- 窗口 ---- */
  .window {
    width: 1140px; height: 664px; margin: 0 auto; background: var(--surface);
    border-radius: 11px; overflow: hidden; display: flex; flex-direction: column;
    box-shadow: 0 30px 70px -20px rgba(0,0,0,.42), 0 4px 14px -6px rgba(0,0,0,.22), 0 0 0 1px rgba(0,0,0,.06);
  }
  .titlebar {
    height: 46px; flex: none; display: flex; align-items: center; gap: 16px;
    padding: 0 12px 0 16px; background: var(--paper); border-bottom: 1px solid var(--line-soft);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 13.5px; }
  .logo {
    width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(180deg, var(--voice-2), var(--voice));
    color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center;
  }
  .modes {
    margin-left: 6px; display: flex; gap: 3px; padding: 3px; border-radius: 9px;
    background: rgba(20,23,26,.055);
  }
  .modes span {
    padding: 4px 15px; border-radius: 7px; font-size: 12.5px; color: var(--muted);
  }
  .modes span.on {
    background: var(--card); color: var(--voice); font-weight: 600;
    box-shadow: 0 1px 3px rgba(20,23,26,.10);
  }
  .spacer { flex: 1; }
  .winbtns { display: flex; align-items: center; gap: 2px; }
  .winbtns i {
    width: 34px; height: 26px; display: grid; place-items: center;
    font-style: normal; font-size: 11px; color: var(--ink-2); border-radius: 6px;
  }
  .winbtns i.close { font-size: 12px; }
  /* ---- 主体 ---- */
  .body { flex: 1; display: flex; min-height: 0; }
  /* 左栏 */
  .side {
    width: 268px; flex: none; background: var(--paper); border-right: 1px solid var(--line-soft);
    display: flex; flex-direction: column; min-height: 0;
  }
  .side-top { padding: 12px 12px 8px; }
  .search {
    height: 32px; border-radius: 9px; background: rgba(20,23,26,.045); border: 1px solid transparent;
    display: flex; align-items: center; padding: 0 10px; gap: 7px; color: var(--faint); font-size: 12.5px;
  }
  .side-list { flex: 1; overflow: hidden; padding: 2px 8px 8px; }
  .grouplabel {
    font-size: 11.5px; color: var(--faint); padding: 12px 8px 6px; letter-spacing: .3px;
  }
  .row {
    display: flex; align-items: center; gap: 10px; padding: 8px 9px; border-radius: 9px;
    margin-bottom: 1px; position: relative;
  }
  .row.on { background: var(--card); box-shadow: 0 1px 3px rgba(20,23,26,.07); }
  .row.on::before {
    content: ""; position: absolute; left: -4px; top: 9px; bottom: 9px; width: 3px;
    border-radius: 3px; background: var(--voice);
  }
  .av {
    width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center;
    font-size: 13px; font-weight: 600; color: #fff; background: #9aa3a0;
  }
  .av.g1 { background: linear-gradient(160deg,#5b8f7c,#2b6a56); }
  .av.g2 { background: linear-gradient(160deg,#7d88a8,#4d5a7d); }
  .av.g3 { background: linear-gradient(160deg,#b08a6a,#8a6647); }
  .av.g4 { background: linear-gradient(160deg,#8f7fa8,#63507d); }
  .meta { min-width: 0; flex: 1; }
  .meta b { display: block; font-size: 13.2px; font-weight: 600; }
  .meta i {
    display: block; font-style: normal; font-size: 12px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row em { font-style: normal; font-size: 11px; color: var(--faint); align-self: flex-start; margin-top: 2px; }
  /* 中栏 */
  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--surface); }
  .chat-head {
    height: 56px; flex: none; display: flex; align-items: center; gap: 11px;
    padding: 0 20px; border-bottom: 1px solid var(--line-soft); background: var(--surface);
  }
  .chat-head b { font-size: 14px; font-weight: 600; display: block; }
  .chat-head i { font-style: normal; font-size: 12px; color: var(--muted); }
  .stream { flex: 1; overflow: hidden; padding: 22px 26px 8px; display: flex; flex-direction: column; gap: 16px; }
  .day { text-align: center; font-size: 11.5px; color: var(--faint); }
  .msg { display: flex; gap: 10px; max-width: 78%; }
  .msg .who { font-size: 11.5px; color: var(--faint); margin-bottom: 4px; }
  .bubble {
    padding: 10px 14px; border-radius: 13px; font-size: 13.6px; line-height: 1.65;
    background: var(--card); border: 1px solid var(--line-soft); box-shadow: 0 1px 2px rgba(20,23,26,.04);
  }
  .msg.them { align-self: flex-start; }
  .msg.me { align-self: flex-end; flex-direction: row-reverse; }
  .msg.me .bubble {
    background: var(--voice-soft); color: #1f4f40;
    border: 1px solid rgba(43,106,86,.28); box-shadow: none;
  }
  .msg.me .who { text-align: right; }
  .msg.me .who b { color: var(--voice); }
  .acts { display: flex; gap: 6px; margin-top: 7px; justify-content: flex-end; }
  .acts button {
    border: 1px solid var(--line); background: var(--card); border-radius: 8px;
    padding: 4px 11px; font-size: 11.8px; color: var(--ink-2); font-family: inherit;
  }
  .acts button.primary {
    background: linear-gradient(180deg, var(--voice-2), var(--voice)); color: #fff;
    border-color: transparent; font-weight: 600; box-shadow: 0 4px 10px -6px rgba(43,106,86,.9);
  }
  .typing { display: flex; gap: 4px; padding: 13px 15px; }
  .typing s {
    width: 6px; height: 6px; border-radius: 50%; background: #b9bfbc; display: block;
  }
  /* 输入区 */
  .composer {
    flex: none; padding: 12px 20px 16px; background: var(--surface); border-top: 1px solid var(--line-soft);
  }
  .composer-row { display: flex; align-items: flex-end; gap: 10px; }
  .pending { display: flex; gap: 8px; margin-bottom: 9px; }
  .clip {
    width: 40px; height: 40px; flex: none; border-radius: 11px; border: 1px solid var(--line);
    background: var(--card); display: grid; place-items: center; color: var(--ink-2); font-size: 17px;
  }
  .field {
    flex: 1; min-height: 40px; border-radius: 11px; border: 1px solid var(--line);
    background: var(--card); padding: 10px 13px; color: var(--faint); font-size: 13.4px;
    box-shadow: 0 1px 2px rgba(20,23,26,.03);
  }
  .send {
    height: 40px; padding: 0 20px; border-radius: 11px; border: 0; flex: none;
    background: linear-gradient(180deg, var(--voice-2), var(--voice)); color: #fff;
    font-size: 13.4px; font-weight: 600; display: grid; place-items: center;
  }
  .hintline { margin-top: 9px; font-size: 11.8px; color: var(--faint); }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px;
    background: var(--card); border: 1px solid var(--line); font-size: 12px; color: var(--ink-2);
  }
</style>
</head>
<body>
<div class="window">
  <header class="titlebar">
    <div class="brand"><span class="logo">晚</span><span>晚风 Agent</span></div>
    <div class="modes"><span class="on">晚风</span><span>早安</span></div>
    <div class="spacer"></div>
    <div class="winbtns"><i>—</i><i>▢</i><i class="close">✕</i></div>
  </header>
  <div class="body">
    <aside class="side">
      <div class="side-top">
        <div class="search">🔍 搜人，或者聊过的事</div>
      </div>
      <div class="side-list">
        <div class="grouplabel">最近</div>
        <div class="row on">
          <div class="av g1">陈</div>
          <div class="meta"><b>老陈</b><i>周六下午可以，你定场地？</i></div>
          <em>14:22</em>
        </div>
        <div class="row">
          <div class="av g2">哲</div>
          <div class="meta"><b>阿哲</b><i>那晚上开黑？老位置</i></div>
          <em>昨天</em>
        </div>
        <div class="row">
          <div class="av g3">王</div>
          <div class="meta"><b>王姐</b><i>周报记得周五前发我</i></div>
          <em>周二</em>
        </div>
        <div class="grouplabel">高中那桌</div>
        <div class="row">
          <div class="av g4">林</div>
          <div class="meta"><b>林志豪</b><i>暑假回来聚一次</i></div>
          <em>3 天</em>
        </div>
        <div class="row">
          <div class="av">许</div>
          <div class="meta"><b>许伟</b><i>在忙吗</i></div>
          <em>上周</em>
        </div>
        <div class="grouplabel">家里</div>
        <div class="row">
          <div class="av g3">妈</div>
          <div class="meta"><b>老妈</b><i>钱够花吗，不够跟我说</i></div>
          <em>上周</em>
        </div>
      </div>
    </aside>
    <main class="chat">
      <div class="chat-head">
        <div class="av g1">陈</div>
        <div><b>老陈</b><i>高中同学 · 熟人语气</i></div>
      </div>
      <div class="stream">
        <div class="day">今天 14:18</div>
        <div class="msg them">
          <div>
            <div class="who">老陈</div>
            <div class="bubble">周末有空吗？一起去打球</div>
          </div>
        </div>
        <div class="msg me">
          <div>
            <div class="who">晚风</div>
            <div class="bubble">周六下午可以，你定场地？</div>
          </div>
        </div>
        <div class="msg them">
          <div>
            <div class="who">老陈</div>
            <div class="bubble">那就老地方，三点</div>
          </div>
        </div>
        <div class="msg me">
          <div>
            <div class="who">晚风</div>
            <div class="bubble">行，我到点过去</div>
          </div>
        </div>
      </div>
      <div class="composer">
        <div class="pending">
          <span class="chip">📄 周报.docx</span>
        </div>
        <div class="composer-row">
          <div class="clip">＋</div>
          <div class="field">说点什么，或者贴张图</div>
          <div class="send">发送</div>
        </div>
        <div class="hintline">
          Enter 发送 · Shift+Enter 换行 · 可以直接粘图或拖文件进来
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
