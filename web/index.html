<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>晚风 Agent</title>
<style>
  :root {
    --ink: #14171a;
    --ink-2: #3d444a;
    --muted: #767b80;
    --paper: #f7f7f5;
    --line: rgba(20, 23, 26, .09);
    --line-soft: rgba(20, 23, 26, .055);
    --voice: #2b6a56;
    --voice-2: #38806a;
    --voice-ink: #1f4f40;
    --warn: #a1492b;
    --r-md: 13px;
    --r-lg: 18px;
    --shadow-1: 0 1px 2px rgba(20,23,26,.05), 0 1px 1px rgba(20,23,26,.03);
    --shadow-2: 0 10px 30px -14px rgba(20,23,26,.20), 0 2px 8px -4px rgba(20,23,26,.08);
    --inner-hi: inset 0 1px 0 rgba(255,255,255,.72);
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink); background: var(--paper);
    font: 15px/1.7 -apple-system, "Segoe UI Variable", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  /* 环境光与颗粒：让底色不是一块死平的色块，这是"不塑料"的地基 */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(900px 520px at 10% -12%, rgba(43,106,86,.11), transparent 62%),
      radial-gradient(760px 420px at 92% -6%, rgba(43,106,86,.06), transparent 58%),
      radial-gradient(1100px 700px at 50% 118%, rgba(20,23,26,.04), transparent 60%);
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .03;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  }
  .app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }
  button { font: inherit; cursor: pointer; color: inherit; }
  :focus-visible { outline: 2px solid var(--voice); outline-offset: 2px; border-radius: 6px; }
  ::selection { background: rgba(43,106,86,.18); }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(20,23,26,.14); border: 3px solid transparent; background-clip: content-box; border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(20,23,26,.26); background-clip: content-box; }

  /* 玻璃：模糊 + 饱和度 + 1px 内高光，模拟玻璃边缘折射 */
  .glass {
    background: rgba(255,255,255,.66);
    -webkit-backdrop-filter: blur(20px) saturate(1.7);
    backdrop-filter: blur(20px) saturate(1.7);
    box-shadow: var(--inner-hi);
  }

  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
    padding: 13px 26px; border-bottom: 1px solid var(--line-soft);
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .mark {
    width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(160deg, var(--voice-2), var(--voice-ink));
    color: #fff; font-size: 14px; font-weight: 600;
    box-shadow: 0 6px 16px -8px rgba(43,106,86,.75), var(--inner-hi);
  }
  .brand h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: .04em; white-space: nowrap; }
  .brand small { display: block; font-size: 11.5px; font-weight: 400; color: var(--muted); white-space: nowrap; }

  .modes {
    position: relative; display: inline-flex; padding: 3px; border-radius: 999px;
    background: rgba(255,255,255,.62); border: 1px solid var(--line-soft);
    box-shadow: var(--inner-hi), 0 1px 2px rgba(20,23,26,.04);
  }
  .modes .pill {
    position: absolute; top: 3px; bottom: 3px; left: 0; width: 0; border-radius: 999px;
    background: linear-gradient(180deg, var(--voice-2), var(--voice));
    box-shadow: 0 4px 14px -6px rgba(43,106,86,.8), var(--inner-hi);
    transition: transform .46s var(--ease), width .46s var(--ease);
  }
  .modes button {
    position: relative; z-index: 1; border: 0; background: transparent; border-radius: 999px;
    padding: 6px 18px; font-size: 13.5px; color: var(--muted); white-space: nowrap;
    transition: color .3s var(--ease);
  }
  .modes button[aria-pressed="true"] { color: #fff; font-weight: 600; }
  .modes button:hover { color: var(--ink); }
  .modes button[aria-pressed="true"]:hover { color: #fff; }
  .spacer { margin-left: auto; }
  .meter { font-size: 12px; color: var(--muted); white-space: nowrap; }

  main { flex: 1; display: grid; grid-template-columns: minmax(0,1fr) 306px; min-height: 0; }
  .stream { overflow-y: auto; padding: 34px 30px 16px; }
  .thread { max-width: 68ch; margin: 0 auto; }

  .turn { display: grid; grid-template-columns: 2.5px minmax(0,1fr); gap: 17px; margin-bottom: 28px; }
  .turn .rule { border-radius: 99px; background: linear-gradient(180deg, var(--voice-2), rgba(43,106,86,.35)); }
  .turn.register-客气 .rule { background: repeating-linear-gradient(180deg, var(--voice-2) 0 7px, transparent 7px 14px); }
  .turn.register-本人 .rule { background: linear-gradient(180deg, rgba(20,23,26,.42), rgba(20,23,26,.12)); }
  .turn .head { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
  .turn .name { font-size: 12.5px; font-weight: 650; color: var(--voice-ink); letter-spacing: .05em; }
  .turn .tag {
    font-size: 11px; color: var(--muted); padding: 1px 8px; border-radius: 99px;
    background: rgba(20,23,26,.04); border: 1px solid var(--line-soft);
  }
  .turn p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .turn.user { grid-template-columns: minmax(0,1fr); }
  .turn.user .bubble {
    justify-self: end; max-width: 80%; padding: 11px 15px; border-radius: var(--r-md);
    background: linear-gradient(180deg, #fff, #fbfbfa);
    border: 1px solid var(--line); box-shadow: var(--shadow-1), var(--inner-hi);
  }
  .turn.note { grid-template-columns: minmax(0,1fr); }
  .turn.note p { color: var(--muted); font-size: 13.5px; }

  .hit {
    margin-top: 9px; font-size: 12px; color: var(--muted);
    display: inline-flex; align-items: center; gap: 7px;
  }
  .hit::before {
    content: ""; width: 4px; height: 4px; border-radius: 50%;
    background: currentColor; opacity: .5; flex: none;
  }

  .intro { max-width: 68ch; margin: 0 auto 26px; }
  .intro h2 { font-size: 27px; line-height: 1.25; margin: 0 0 12px; font-weight: 600; letter-spacing: -.015em; }
  .intro > p { margin: 0 0 22px; color: var(--ink-2); max-width: 56ch; }
  .intro b { font-weight: 600; color: var(--voice-ink); }
  .seeds { display: grid; gap: 9px; }
  .seeds button {
    position: relative; overflow: hidden; text-align: left;
    background: linear-gradient(180deg, #fff, #fcfcfb);
    border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 15px;
    display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; align-items: baseline;
    box-shadow: var(--shadow-1), var(--inner-hi);
    transition: transform .38s var(--ease), box-shadow .38s var(--ease), border-color .38s var(--ease);
  }
  .seeds button:hover { transform: translateY(-2px); border-color: rgba(43,106,86,.35); box-shadow: var(--shadow-2), var(--inner-hi); }
  .seeds button:active { transform: translateY(0) scale(.995); }
  .seeds button span { font-size: 12px; color: var(--muted); }
  @media (max-width: 680px) {
    .seeds button { grid-template-columns: 1fr; }
  }
  .seeds button::after {
    content: ""; position: absolute; inset: 0; transform: translateX(-120%); pointer-events: none;
    background: linear-gradient(105deg, transparent 25%, rgba(255,255,255,.55) 48%, transparent 72%);
    transition: transform .85s var(--ease);
  }
  .seeds button:hover::after { transform: translateX(120%); }

  .typing { display: inline-flex; gap: 4px; padding-top: 5px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--voice); animation: breathe 1.2s var(--ease) infinite; }
  .typing i:nth-child(2) { animation-delay: .14s; }
  .typing i:nth-child(3) { animation-delay: .28s; }
  @keyframes breathe { 0%,100% { opacity:.2; transform: translateY(0) scale(.9); } 45% { opacity:.95; transform: translateY(-2px) scale(1); } }
  @keyframes rise { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
  .turn { animation: rise .5s var(--ease) both; }
  .turn .head { animation: rise .5s var(--ease) both .04s; }
  .turn p { animation: rise .5s var(--ease) both .07s; }
  .hit { animation: rise .5s var(--ease) both .1s; }
  .intro > * { animation: rise .55s var(--ease) both; }
  .intro > p { animation-delay: .05s; }
  .seeds button:nth-child(1) { animation: rise .55s var(--ease) both .1s; }
  .seeds button:nth-child(2) { animation: rise .55s var(--ease) both .16s; }
  .seeds button:nth-child(3) { animation: rise .55s var(--ease) both .22s; }

  .error { color: var(--warn); font-size: 13.5px; }
  .error button { border: 0; background: none; color: var(--warn); border-bottom: 1px solid currentColor; padding: 0; margin-left: 6px; }

  aside {
    border-left: 1px solid var(--line-soft); overflow-y: auto; padding: 26px 20px 40px;
    background: rgba(255,255,255,.44);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  .block { margin-bottom: 26px; }
  .block h3 { font-size: 11.5px; letter-spacing: .1em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .ident {
    border: 1px solid var(--line-soft); border-radius: var(--r-lg); padding: 15px;
    background: linear-gradient(180deg, rgba(255,255,255,.86), rgba(255,255,255,.62));
    box-shadow: var(--shadow-1), var(--inner-hi);
  }
  .ident .top { display: flex; align-items: center; gap: 11px; transition: opacity .3s var(--ease), transform .3s var(--ease); }
  .ident.flip .top { opacity: 0; transform: translateY(-5px); }
  .mono {
    width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
    font-size: 15px; font-weight: 600; color: var(--voice-ink);
    background: linear-gradient(160deg, rgba(43,106,86,.17), rgba(43,106,86,.07));
    box-shadow: var(--inner-hi), 0 0 0 1px rgba(43,106,86,.12);
  }
  .ident .nm { font-size: 15.5px; font-weight: 600; }
  .ident .rl { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .tone-row {
    margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--line-soft);
    font-size: 12.8px; color: var(--voice-ink); display: flex; gap: 8px; align-items: flex-start;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--voice); margin-top: 8px; flex: none; box-shadow: 0 0 0 3px rgba(43,106,86,.14); }
  .unknown { font-size: 13px; color: var(--muted); }
  footer { position: sticky; bottom: 0; z-index: 20; padding: 14px 30px 18px; border-top: 1px solid var(--line-soft); }
  .composer { max-width: 68ch; margin: 0 auto; display: flex; gap: 11px; align-items: flex-end; }
  .field {
    flex: 1; display: flex; align-items: flex-end; gap: 8px; padding: 11px 13px;
    background: linear-gradient(180deg, #fff, #fcfcfb);
    border: 1px solid var(--line); border-radius: var(--r-md);
    box-shadow: var(--shadow-1), var(--inner-hi);
    transition: border-color .3s var(--ease), box-shadow .3s var(--ease);
  }
  .field:focus-within { border-color: rgba(43,106,86,.5); box-shadow: 0 0 0 4px rgba(43,106,86,.10), var(--shadow-1), var(--inner-hi); }
  textarea {
    flex: 1; border: 0; outline: none; resize: none; background: transparent;
    font: inherit; color: var(--ink); min-height: 24px; max-height: 170px;
  }
  textarea::placeholder { color: #a2a7ac; }
  .hint-key { font-size: 11px; color: #a8adb2; white-space: nowrap; }
  .send {
    position: relative; overflow: hidden; border: 0; border-radius: var(--r-md);
    padding: 12px 22px; font-weight: 600; color: #fff;
    background: linear-gradient(180deg, var(--voice-2), var(--voice));
    box-shadow: 0 8px 20px -12px rgba(43,106,86,.9), var(--inner-hi);
    transition: transform .32s var(--ease), box-shadow .32s var(--ease), opacity .3s var(--ease);
  }
  .send:hover { transform: translateY(-1.5px); box-shadow: 0 14px 26px -14px rgba(43,106,86,.95), var(--inner-hi); }
  .send:active { transform: translateY(0) scale(.985); }
  .send:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .send::after {
    content: ""; position: absolute; inset: 0; transform: translateX(-130%); pointer-events: none;
    background: linear-gradient(105deg, transparent 28%, rgba(255,255,255,.42) 50%, transparent 72%);
    transition: transform .9s var(--ease);
  }
  .send:not(:disabled):hover::after { transform: translateX(130%); }
  .tip { max-width: 68ch; margin: 9px auto 0; font-size: 12px; color: var(--muted); }
  .attach { max-width: 68ch; margin: 0 auto 10px; display: none; gap: 9px; flex-wrap: wrap; }
  .attach.on { display: flex; }
  .chip {
    position: relative; width: 62px; height: 62px; border-radius: 11px; overflow: hidden;
    background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow-1);
  }
  .chip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .chip button {
    position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; padding: 0;
    border: 0; border-radius: 50%; background: rgba(20,23,26,.6); color: #fff; font-size: 12px;
    line-height: 1; display: grid; place-items: center;
  }
  .chip button:hover { background: rgba(20,23,26,.88); }
  .pick {
    border: 1px solid var(--line); background: #fff; border-radius: var(--r-md);
    padding: 12px 13px; color: var(--muted); font-size: 13px; white-space: nowrap;
    box-shadow: var(--shadow-1), var(--inner-hi);
    transition: border-color .3s var(--ease), color .3s var(--ease);
  }
  .pick:hover { border-color: rgba(43,106,86,.5); color: var(--voice-ink); }
  .bubble .shots { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .bubble .shots img {
    max-width: 190px; max-height: 190px; border-radius: 9px;
    border: 1px solid var(--line); display: block;
  }

  @media (max-width: 1040px) {
    main { grid-template-columns: 1fr; }
    aside { display: none; }
  }
  @media (max-width: 720px) {
    header { padding: 12px 16px; gap: 12px; }
    .brand small, .meter, .hint-key { display: none; }
    .stream { padding: 22px 16px 10px; }
    footer { padding: 12px 16px 14px; }
    .intro h2 { font-size: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="glass">
    <div class="brand">
      <div class="mark">晚</div>
      <div>
        <h1>晚风 Agent</h1>
        <small>晚风是你本人 · 早安是你的助理</small>
      </div>
    </div>
    <div class="modes" id="modes">
      <span class="pill" id="pill"></span>
      <button data-mode="persona" aria-pressed="true">晚风</button>
      <button data-mode="assistant" aria-pressed="false">早安</button>
    </div>
    <div class="spacer"></div>
    <div class="meter" id="meter"></div>
  </header>

  <main>
    <section class="stream" id="stream"></section>
    <aside>
      <div class="block">
        <h3 id="whoTitle">正在跟它说话的是谁</h3>
        <div class="ident" id="ident"></div>
      </div>
    </aside>
  </main>

  <footer class="glass">
    <div class="attach" id="attach"></div>
    <div class="composer">
      <button class="pick" id="pick" title="添加图片">＋ 图片</button>
      <input type="file" id="picker" accept="image/*" multiple hidden>
      <label class="field">
        <textarea id="input" rows="1" placeholder="说点什么…（可以直接粘图）"></textarea>
        <span class="hint-key">Enter 发送</span>
      </label>
      <button class="send" id="send">发送</button>
    </div>
    <div class="tip" id="tip"></div>
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const state = { mode: "persona", partner: "", scene: "", hit: null, busy: false,
                images: [],
                history: { persona: [], assistant: [] },
                summary: { persona: "", assistant: "" } };

const MAX_IMAGES = 4;
const MAX_SIDE = 1568;        // 长边超过这个就缩小：省 token，也让模型看得清

const speakerName = () => state.mode === "assistant" ? "早安" : "晚风";

const esc = (s) => String(s ?? "").replace(/[&<>"]/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function api(path, body) {
  const res = await fetch(path, body ? {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  } : undefined);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

function registerOf(scene) {
  if (!scene || scene === "未识别") return { cls: "", label: "" };
  if (["亲密关系", "高中同学", "初中同学", "大学同学", "朋友", "家人", "游戏群"].includes(scene))
    return { cls: "register-熟人", label: "熟人" };
  if (scene === "本人") return { cls: "register-本人", label: "自己" };
  if (scene === "助理") return { cls: "register-本人", label: "助手" };
  return { cls: "register-客气", label: "客气" };
}

function movePill() {
  const active = $("modes").querySelector('button[aria-pressed="true"]');
  if (!active) return;
  const pill = $("pill");
  pill.style.width = active.offsetWidth + "px";
  pill.style.transform = "translateX(" + active.offsetLeft + "px)";
}

function renderPanel() {
  const node = $("ident");
  const assistant = state.mode === "assistant";
  $("whoTitle").textContent = assistant ? "谁在用" : "正在跟它说话的是谁";
  node.classList.add("flip");
  setTimeout(() => {
    if (assistant) {
      node.innerHTML = '<div class="top"><div class="mono">林</div>'
        + '<div><div class="nm">只有你自己</div><div class="rl">早安 · 助理</div></div></div>'
        + '<div class="tone-row"><span class="dot"></span>'
        + '<span>你直接问它就行，怎么回由它自己定。别人看不到这里。</span></div>';
    } else if (!state.partner) {
      node.innerHTML = '<div class="unknown">还不知道对面是谁。它会按不熟的人那一档直接聊，'
        + '不必先报身份——对方愿意说「我是谁」更好，不说也没关系。</div>';
    } else {
      const ch = esc(state.partner.trim().charAt(0) || "?");
      const layer = state.hit && state.hit.layer;
      const sub = layer === "card" ? "内层薄卡" : (layer === "scene" ? "外层大类" : "没有记录");
      const note = layer === "card" ? "按这一张薄卡上记的说话方式回他"
        : (layer === "scene" ? "只有大类，按这类人的口吻回他"
        : "通讯录里没这个人，按不熟的说话方式回他");
      node.innerHTML = '<div class="top"><div class="mono">' + ch + '</div>'
        + '<div><div class="nm">' + esc(state.partner) + '</div>'
        + '<div class="rl">' + esc(state.scene || "未分类") + ' · 命中 ' + sub + '</div></div></div>'
        + '<div class="tone-row"><span class="dot"></span><span>'
        + esc(note) + '</span></div>';
    }
    node.classList.remove("flip");
  }, 130);
}

// 只说这轮认到的是哪一层，不展示「依据」明细
function hitText(evidence) {
  if (!evidence) return "";
  if (evidence.scene === "忘记了") return "认出来了，但你当年就记不住这个人：回固定的一句";
  const hit = evidence.hit;
  if (!hit || hit.layer === "self") return "";
  if (hit.layer === "card") return "命中内层薄卡：" + (hit.label || "");
  if (hit.layer === "scene") return "命中外层大类：" + (hit.label || "");
  if (hit.layer === "unknown") return "还没认出对方是谁";
  return "未命中：通讯录里没这个人，按「" + ((evidence.tier) || "同龄不熟") + "」的说话方式回";
}

function lookupText(evidence) {
  const trace = (evidence && evidence.tool_trace) || [];
  if (!trace.length) return "";
  const labels = trace.map(t => {
    const args = t.args || {};
    const name = args.name || "";
    const kw = args.keyword || "";
    if (t.tool === "who_is") return name ? ("「" + name + "」是谁") : "这个人是谁";
    if (t.tool === "recent_with") return name ? ("跟" + name + "的最近记录") : "最近记录";
    if (t.tool === "search_chats") return kw ? ("聊天记录里的「" + kw + "」") : "聊天记录";
    if (t.tool === "my_facts") return "关于你的事实";
    return t.tool || "";
  }).filter(Boolean);
  return labels.length ? "查了：" + labels.join("、") : "";
}

function addTurn(kind, text, evidence) {
  const box = document.createElement("div");
  if (kind === "agent") {
    const reg = registerOf(evidence && evidence.scene);
    const assistant = state.mode === "assistant";
    box.className = "turn agent " + reg.cls;
    const hit = assistant ? "" : hitText(evidence);
    const looked = lookupText(evidence);
    const tag = (!assistant && reg.label)
      ? '<span class="tag">语气 · ' + esc(reg.label) + '</span>' : "";
    box.innerHTML = '<span class="rule"></span><div class="body"><div class="head">'
      + '<span class="name">' + speakerName() + '</span>' + tag
      + '</div><p>' + esc(text) + '</p>'
      + (looked ? '<div class="hit">' + esc(looked) + '</div>' : "")
      + (hit ? '<div class="hit">' + esc(hit) + '</div>' : "")
      + '</div>';
  } else if (kind === "user") {
    box.className = "turn user";
    const shots = (images && images.length)
      ? '<div class="shots">' + images.map(im => '<img src="' + im.url + '" alt="">').join("") + '</div>'
      : "";
    box.innerHTML = '<div class="bubble">'
      + (text ? '<p>' + esc(text) + '</p>' : "") + shots + '</div>';
  } else {
    box.className = "turn note";
    box.innerHTML = '<div class="body"><p>' + esc(text) + '</p></div>';
  }
  $("stream").appendChild(box);
  $("stream").scrollTop = $("stream").scrollHeight;
  return box;
}

const INTROS = {
  persona: {
    title: "别人找晚风，等于找你。",
    lead: "晚风就是你本人。谁跟它说话，它就用你的方式直接回一句，语气按对方是谁自动切换，"
        + "而且知道你现在在哪、在忙什么。",
    seeds: [
      ["你是谁", "别人问它，它用本人的方式回答"],
      ["我是谢总，周末打球吗", "认出人来之后换成熟人语气"],
      ["我是导师，这个任务明天能给我吗", "换个人来问，语气跟着变"],
    ],
  },
  assistant: {
    title: "早安只给你用。",
    lead: "早安是一个了解你全部情况的助手，替你办事、给建议、做安排，"
        + "怎么跟你说话由它自己定，不套用任何人的语气。"
        + "别人看不到这里——别人找过来，看到的是晚风。",
    seeds: [
      ["谢总是谁", "让它用自己的话讲讲这个人"],
      ["帮我把这周实习做了什么理一下", "用你的真实信息帮你整理"],
      ["朋友问我最近在忙什么，帮我想怎么回", "让它替你想一句"],
    ],
  },
};

function renderIntro() {
  const data = INTROS[state.mode];
  const intro = document.createElement("div");
  intro.className = "intro";
  intro.innerHTML = '<h2>' + esc(data.title) + '</h2>'
    + '<p>' + esc(data.lead) + '</p>'
    + '<div class="seeds">'
    + data.seeds.map(s => '<button data-seed="' + esc(s[0]) + '"><b>' + esc(s[0])
        + '</b><span>' + esc(s[1]) + '</span></button>').join("")
    + '</div>';
  $("stream").appendChild(intro);
  intro.querySelectorAll("[data-seed]").forEach(btn =>
    btn.addEventListener("click", () => { $("input").value = btn.dataset.seed; send(); }));
}

function setTip() {
  $("tip").textContent = state.mode === "persona"
    ? "晚风：认不出对方时按不熟的人直接聊，不必先问身份。"
    : "早安：直接问它就行，它了解你的全部情况，不冒充你。";
}

function autoGrow() {
  const el = $("input");
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 170) + "px";
}

// ---------- 图片：压缩成 data URL，挂在待发区 ----------
async function shrink(file) {
  if (!file || !(file.type || "").startsWith("image/")) return null;
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
    const w = Math.max(1, Math.round(bmp.width * scale));
    const h = Math.max(1, Math.round(bmp.height * scale));
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";                       // 透明底转 JPEG 会发黑，先铺一层白
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(bmp, 0, 0, w, h);
    if (bmp.close) bmp.close();
    return canvas.toDataURL("image/jpeg", 0.88);
  } catch (e) {
    return null;
  }
}

async function addImages(files) {
  const room = MAX_IMAGES - state.images.length;
  for (const f of files.slice(0, Math.max(0, room))) {
    const url = await shrink(f);
    if (url) state.images.push({ url, name: f.name || "粘贴的图片" });
  }
  if (files.length > room) {
    setTip("一次最多带 " + MAX_IMAGES + " 张图，多的先没收。");
    setTimeout(setTip, 3200);
  }
  renderAttach();
}

function renderAttach() {
  const box = $("attach");
  box.innerHTML = state.images.map((im, i) =>
    '<div class="chip"><img src="' + im.url + '" alt="">'
    + '<button data-drop="' + i + '" title="移除这张">×</button></div>').join("");
  box.classList.toggle("on", state.images.length > 0);
  box.querySelectorAll("[data-drop]").forEach(btn =>
    btn.addEventListener("click", () => {
      state.images.splice(Number(btn.dataset.drop), 1); renderAttach();
    }));
}

async function onPaste(e) {
  const dt = e.clipboardData;
  if (!dt) return;
  let files = Array.from(dt.items || [])
    .filter(it => it.kind === "file" && (it.type || "").startsWith("image/"))
    .map(it => it.getAsFile()).filter(Boolean);
  if (!files.length) files = Array.from(dt.files || []).filter(f => (f.type || "").startsWith("image/"));
  if (!files.length) return;                      // 没有图片：按原来的文本粘贴走
  if (!(dt.getData("text/plain") || "").trim()) e.preventDefault();  // 截图：别往输入框里插东西
  await addImages(files);
}

// 发给后端的历史：只保留最近一条带图的消息，免得每轮都把老图重发一遍
function historyForSend(mode) {
  const items = state.history[mode].slice(0, -1).slice(-40);
  let lastWithImages = -1;
  items.forEach((m, i) => { if (m.images && m.images.length) lastWithImages = i; });
  return items.map((m, i) => ({
    role: m.role, text: m.text,
    images: i === lastWithImages ? m.images.map(x => x.url) : undefined,
  }));
}

async function send() {
  const text = $("input").value.trim();
  const images = state.images.slice();
  if ((!text && !images.length) || state.busy) return;
  $("input").value = ""; state.images = []; renderAttach(); autoGrow();
  const intro = document.querySelector(".intro");
  if (intro) intro.remove();
  state.history[state.mode].push({ role: "user", text, images });
  addTurn("user", text, images);
  state.busy = true; $("send").disabled = true;
  const wait = addTurn("agent", "", { scene: state.scene });
  wait.querySelector("p").innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  try {
    const reply = await api("/api/chat", {
      message: text, mode: state.mode,
      images: images.map(im => im.url),
      partner: state.mode === "persona" ? state.partner : "",
      history: historyForSend(state.mode),
      summary: state.summary[state.mode] || "",
    });
    if (reply.partner) state.partner = reply.partner;
    state.scene = (reply.evidence && reply.evidence.scene) || state.scene;
    state.hit = (reply.evidence && reply.evidence.hit) || null;
    if (reply.evidence && reply.evidence.session_summary)
      state.summary[state.mode] = reply.evidence.session_summary;
    state.history[state.mode].push({ role: "agent", text: reply.text });
    wait.remove();
    addTurn("agent", reply.text, reply.evidence);
    if (reply.need_identity) { state.partner = ""; state.scene = ""; state.hit = null; }
  } catch (e) {
    wait.remove();
    const box = addTurn("note", "");
    box.querySelector("p").innerHTML = '<span class="error">没连上模型：' + esc(e.message)
      + '<button id="retry">重试</button></span>';
    box.querySelector("#retry").addEventListener("click", () => {
      $("input").value = text; state.images = images.slice(); renderAttach(); send();
    });
  } finally {
    state.busy = false; $("send").disabled = false;
    renderPanel();
  }
}

document.querySelectorAll("#modes button").forEach(btn => {
  btn.addEventListener("click", () => {
    state.mode = btn.dataset.mode;
    document.querySelectorAll("#modes button").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.mode === state.mode)));
    movePill();
    state.partner = ""; state.scene = ""; state.hit = null;
    $("stream").innerHTML = "";
    state.history[state.mode].forEach(m =>
      addTurn(m.role === "user" ? "user" : "agent", m.text, m.images));
    if (!state.history[state.mode].length) renderIntro();
    renderPanel(); setTip();
  });
});

$("send").addEventListener("click", send);
$("input").addEventListener("input", autoGrow);
$("input").addEventListener("paste", onPaste);
$("pick").addEventListener("click", () => $("picker").click());
$("picker").addEventListener("change", async e => {
  await addImages(Array.from(e.target.files || []));
  e.target.value = "";
});
document.addEventListener("dragover", e => {
  if (Array.from((e.dataTransfer && e.dataTransfer.types) || []).includes("Files")) e.preventDefault();
});
document.addEventListener("drop", async e => {
  const files = Array.from((e.dataTransfer && e.dataTransfer.files) || [])
    .filter(f => (f.type || "").startsWith("image/"));
  if (!files.length) return;
  e.preventDefault();
  await addImages(files);
});
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
window.addEventListener("resize", movePill);

async function boot() {
  renderIntro(); renderPanel(); setTip();
  requestAnimationFrame(movePill);
  try {
    const o = await api("/api/overview");
    const c = o.cost || {};
    $("meter").textContent = c.calls
      ? c.calls.toLocaleString() + " 次调用 · 约 $" + (c.total_cost_usd || 0).toFixed(2) : "";
    renderPanel();
  } catch (e) {
    $("meter").textContent = "接口异常：" + e.message;
  }
}
boot();
</script>
